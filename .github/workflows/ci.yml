name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          npm ci
          uv sync --extra test --frozen

      - name: Verify contracts and SDKs
        run: |
          npm run check
          uv run pytest -q

      - name: Verify generated files are current
        run: git diff --exit-code

      - name: Verify release artifacts
        run: ./scripts/verify-release-artifacts.sh
