name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@wingspan-technology"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          npm ci
          uv sync --extra test --frozen

      - name: Verify release version
        run: ./scripts/verify-release-version.sh "$GITHUB_REF_NAME"

      - name: Verify contracts and SDKs
        run: |
          npm run check
          uv run ruff check src tests
          uv run mypy
          uv run pytest -q

      - name: Verify generated files are current
        run: git diff --exit-code

      - name: Build and verify release artifacts
        run: npm run release:verify

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
