[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "efficio-ppt-components"
version = "0.1.0"
description = "Component contracts, schemas, and prompt-fragment builders for Efficio"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/efficio_ppt_components"]

# Generated SDK resources live inside the package; keep them in the wheel even if
# the _generated tree is ever VCS-ignored.
[tool.hatch.build]
artifacts = ["src/efficio_ppt_components/_generated/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
