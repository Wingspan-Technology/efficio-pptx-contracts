[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "efficio-pptx-contracts"
version = "0.2.0"
description = "Efficio PPTX contracts, schemas, and Python SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4"]

[project.urls]
Repository = "https://github.com/Wingspan-Technology/efficio-pptx-contracts"

[project.optional-dependencies]
test = ["mypy>=2", "pytest>=8", "ruff>=0.16", "types-jsonschema>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/efficio_pptx_contracts"]

# Generated SDK resources live inside the package; keep them in the wheel even if
# the _generated tree is ever VCS-ignored.
[tool.hatch.build]
artifacts = ["src/efficio_pptx_contracts/_generated/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/efficio_pptx_contracts"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
